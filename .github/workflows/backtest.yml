# Weekly walk-forward regression (architecture §9). Needs the archive source enabled and
# `sources.backfill_seasons` set (CLAUDE.md) — both are configuration, not secrets, and both come
# from the committed `config/ci-backtest.yaml` (DL-68). No credentials; free CI compute (NFR-01).
#
# `fpl-dof backtest` is deliberately not part of `run` or pipeline.yml — see
# pipeline/src/fpl_dof/stages/backtest.py: it is slow, needs the historical backfill, and produces a
# finding rather than an artefact the weekly decision consumes.
#
# It grades every registered strategy against the champion (MOD-08), one process per strategy
# (`backtest.strategy_workers`), and appends one record per run to the `ledger` branch under
# `experiments/`, keyed by run id and never overwritten; the Pipeline run restores that directory so
# the model card names the champion's verdict for its digest. It also simulates every graded
# strategy's season and appends the models history under `models_history/` (ORC-06), which the
# Pipeline run publishes as models_history.json. Locally, from a clean checkout, the same rebuild is
# one command: `fpl-dof run --only ingest transform backtest` with this config file (CLAUDE.md).

name: Backtest

on:
  schedule:
    - cron: "17 16 * * 2" # 16:17 UTC Tuesday (odd minute) — well clear of any deadline, once a week
  workflow_dispatch:

concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: write # appends this run's experiments record to the `ledger` branch (MOD-08)

jobs:
  backtest:
    runs-on: ubuntu-latest
    # Measured locally 2026-10-23: c3, engine and c1 over 2024/25-2025/26 (68 folds, refit every
    # fold) took 27 min, ~24 s a fold, mostly C1. `a`, `a_odds` and the experiment variants add theirs, and a
    # runner is slower than the workstation, so the walk may reach ~150 min. If it outgrows
    # this, raise `backtest.refit_every_gameweeks` in config/ci-backtest.yaml (a decision, DP-06).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock

      - name: Install fpl-dof
        run: uv pip install --system -c pipeline/requirements.lock -e "pipeline[dev]"

      # The archive source and the backfill seasons are configuration, not secrets, and they live in
      # a committed file selected here and nowhere else (DL-68). Without it every weekly run since
      # 2026-08-18 failed with "no history for seasons": the `data` branch carries bronze only,
      # and a transform over a bronze store with no archive snapshot has nothing to walk forward.
      - name: Restore data from the `data` branch
        run: python pipeline/scripts/retention.py restore data


      - name: Fetch the archive backfill and conform it
        env:
          FPL_DOF_CONFIG_FILE: config/ci-backtest.yaml
        run: |
          fpl-dof ingest
          fpl-dof transform

      - name: Walk-forward backtest
        env:
          FPL_DOF_CONFIG_FILE: config/ci-backtest.yaml
        run: fpl-dof backtest

      # The record steps run after a failed backtest too: a champion that could not be graded still
      # writes its experiments record, with why (D-32), and nothing written means nothing appended.
      - name: Upload the backtest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            data/gold/**/backtest.json
            data/ledger/experiments/*.json
            data/ledger/models_history/*.json
          retention-days: 90
          if-no-files-found: warn

      - name: Record this run on the `ledger` branch (MOD-08, ORC-06)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          shopt -s nullglob
          for source in experiments models_history; do
            for file in data/ledger/$source/*.json; do
              python pipeline/scripts/retention.py permanent "$file" \
                --remote "$remote" --branch ledger --source "$source" \
                --name "$(basename "$file" .json)" --checkout-dir .ledger-staging
            done
          done

      # ORC-06, DP-15: a models history that could not be built never costs the experiments record
      # appended above; the backtest stage writes why, and the run fails here, on its own.
      - name: Check the models history was built
        run: |
          shopt -s nullglob
          for failure in data/gold/*/models-history-failure.txt; do
            echo "::error title=Models history not built::$(cat "$failure")"
            exit 1
          done

  alert:
    needs: [backtest]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Backtest
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
