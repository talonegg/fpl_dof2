# Lint, type-check, unit/property tests, and the rules coverage gate. Runs the E0 code path
# unchanged (D-10, NFR-09) — every command here matches CLAUDE.md's local commands exactly, just
# translated from the Windows venv paths to a Linux runner.

name: CI

on:
  push:
    branches: [main, pre-release, "dev/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # uv, with its cache, against the same lock (ORC-09).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock

      - name: Install fpl-dof (pipeline[dev])
        run: uv pip install --system -c pipeline/requirements.lock -e "pipeline[dev]"

      - name: docs check (decision index, links, DL-nn citations; DL-74)
        run: python scripts/docs.py check

      - name: ruff check
        run: python -m ruff check pipeline

      - name: ruff format --check
        run: python -m ruff format --check pipeline

      - name: mypy
        working-directory: pipeline
        run: python -m mypy

      - name: import boundaries (MOD-01, DL-87)
        working-directory: pipeline
        run: lint-imports

  # Two shards side by side (ORC-09): every test module runs in exactly one (`--shard`, conftest),
  # so the suite's wall clock is the slower shard's, held to schedule.python_tests_budget_seconds.
  pipeline-test-shard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # uv, with its cache, against the same lock (ORC-09).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock

      - name: Install fpl-dof (pipeline[dev])
        run: uv pip install --system -c pipeline/requirements.lock -e "pipeline[dev]"

      # In parallel (ORC-09), then held to schedule.python_tests_budget_seconds. The coverage gate
      # is its own run of the rules test files, exactly as CLAUDE.md states it, in the first shard:
      # measured over the whole suite it would pass on coverage those files do not give, and
      # tracing every worker cost the suite more than this second run takes.
      - name: pytest (shard ${{ matrix.shard }} of 2) & rules coverage gate (must be 100%)
        working-directory: pipeline
        run: |
          started="$(date -u +%FT%TZ)"
          python -m pytest -q -n auto --shard ${{ matrix.shard }}/2
          if [ "${{ matrix.shard }}" = "0" ]; then
            python -m pytest -q --cov=fpl_dof.rules --cov-fail-under=100 tests/test_rules_build.py tests/test_rules_scoring.py tests/test_rules_legality.py
          fi
          python scripts/ci_runs.py budget python_tests_budget_seconds --since "$started"


  # The required check (branch protection names `pipeline-test`): green only when every shard is.
  # `always()`, because a skipped required job would count as passing.
  pipeline-test:
    needs: [pipeline-test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.pipeline-test-shard.result }}" = "success"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        run: npm run build

      - name: test
        working-directory: web
        run: npm run test -- --run

  # The whole workflow, from its start to its last job, against schedule.ci_workflow_budget_seconds.
  budget:
    needs: [pipeline-lint, pipeline-test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock
      # Only what the script imports; it reads pipeline/src from the checkout.
      - run: uv pip install --system -c pipeline/requirements.lock pandas pydantic pyyaml
      - name: CI workflow within its budget (ORC-09)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/scripts/ci_runs.py budget ci_workflow_budget_seconds

  alert:
    needs: [pipeline-lint, pipeline-test, web, budget]
    if: failure() && github.event_name != 'pull_request'
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: CI
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
