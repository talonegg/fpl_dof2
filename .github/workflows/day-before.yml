# Day-before refresh: one full ingest → pipeline → deploy at about 07:00 Sydney time on the calendar
# day before each gameweek deadline (e.g. Friday morning for a Saturday deadline).
#
# GitHub drops and delays cron firings on this repo, so this fires every 20 minutes at odd minutes
# from 19:07 to 22:47 UTC (05:07–09:47 Sydney under AEST or AEDT). The gate proceeds on the first
# firing on or after 07:00 Sydney on the day before the next FPL deadline (bootstrap-static), and is
# idempotent: once an ingest-slow run the gate itself dispatched since midnight Sydney is queued,
# running or succeeded, later firings are logged no-ops (a failed one is retried by the next
# firing); the owner's manual ingest does not count. It reads each run's typed event and actor,
# never its title (ORC-02). Logic and tests: pipeline/src/fpl_dof/week/cadence.py `gate`.
#
# It reuses the existing chain rather than duplicating it: the gate dispatches ingest-slow.yml with
# `must_publish=true`, which ends by dispatching pipeline.yml with `trigger=day-before` and
# `must_publish=true`; the pipeline's last job deploys only when that run published (deploy.yml,
# ORC-03). Both fail closed: a failed ingest dispatches nothing, and the deploy job fails rather
# than deploying when the run's own contract is missing or stale.
#
# Concurrency: its own group. 19:07–22:47 UTC is clear of ingest-slow's daily firings (02:23,
# fallback 05:41) and — the deadline being > 14 h away — of every deadline-relative tick; the
# dispatched runs join their workflows' own groups, where a newer queued run supersedes an older.

name: Day-before refresh

on:
  schedule:
    - cron: "7,27,47 19-22 * * *" # every 20 min, 05:07–09:47 Sydney (AEST or AEDT)
  workflow_dispatch: # manual: skips the 07:00 check; keeps "deadline is tomorrow" and the dedupe

concurrency:
  group: day-before
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # gh run list: has today's day-before ingest already been dispatched?
    outputs:
      run: ${{ steps.gate.outputs.run }}
      gameweek: ${{ steps.gate.outputs.gameweek }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock
      - name: Install fpl-dof
        run: uv pip install --system -c pipeline/requirements.lock -e pipeline
      # Always exits 0 — an unreadable FPL API or run list is a logged skip, never a partial run.
      - name: First firing from 07:00 Sydney the day before the deadline, once per GW?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python pipeline/scripts/day_before_gate.py
          ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}

  refresh:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch Ingest (slow); GITHUB_TOKEN-dispatched runs do start workflows
    steps:
      - name: Start the full ingest (it dispatches the pipeline, which deploys)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ingest-slow.yml --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" -f must_publish=true
          echo "day-before refresh started for GW${{ needs.gate.outputs.gameweek }}"
