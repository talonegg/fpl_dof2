# E7-S3: build the SPA and deploy the site + published data to GitHub Pages (NFR-01, free on a
# public repository — DL-12).
#
# `web/public/data/` is gitignored (it is generated, not source), so a build from a bare checkout
# has no data to serve. Two paths (ORC-03, DL-94):
#
# - **Called by pipeline.yml** (`from_pipeline`) as its last job, only when that run published. It
#   deploys that run's own `web-data-contract` and nothing else: a missing artefact fails the build.
#   A guard-only or failed pipeline run never calls it, so it deploys nothing. A run that must
#   publish (`must_publish`, the day-before refresh) also requires the contract to be fresh
#   (`contract_fresh.py`, #39: fail closed).
# - **push to main or manual dispatch**, to ship web changes until WEB-01 separates the app from the
#   data. It takes the newest pipeline run that uploaded a contract, whatever its conclusion.
#
# If no contract can be restored, the build fails so actions/deploy-pages leaves the previous site
# live (DP-15, architecture §10.3).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      from_pipeline:
        description: "Deploy the calling pipeline run's own contract."
        type: boolean
        default: false
      must_publish:
        description: "The calling run must publish (the day-before refresh): its contract must be fresh."
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the data directory exists
        run: mkdir -p web/public/data/v1

      - name: Download this pipeline run's contract
        if: inputs.from_pipeline
        uses: actions/download-artifact@v4
        with:
          name: web-data-contract
          path: web/public/data/v1

      - name: Must publish - require the fresh contract
        if: inputs.must_publish
        run: python pipeline/scripts/contract_fresh.py web/public/data/v1 --max-age-hours 6

      # push/dispatch only. The `data` branch has never carried a contract (DL-68), so it comes from
      # the newest pipeline run that uploaded one, whatever that run's conclusion: a run over its
      # budget ends red after it published (ORC-09). Only a run whose `run` job reached the upload
      # has the artefact, so guard-only ticks never crowd the list.
      - name: Restore the newest pipeline run's contract
        if: ${{ !inputs.from_pipeline }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          restored=""
          artefacts="repos/${{ github.repository }}/actions/artifacts"
          while read -r artefact; do
            [ -z "$artefact" ] && continue
            if gh api "$artefacts/$artefact/zip" > "$RUNNER_TEMP/contract.zip" \
                && unzip -oq "$RUNNER_TEMP/contract.zip" -d web/public/data/v1; then
              echo "restored contract artefact $artefact"
              restored=1
              break
            fi
            echo "::warning::contract artefact $artefact could not be downloaded"
          done < <(gh api "$artefacts?name=web-data-contract&per_page=100" \
            --jq '.artifacts | map(select(.expired | not)) | sort_by(.created_at) | reverse | .[].id')
          if [ -z "$restored" ] || [ -z "$(ls -A web/public/data/v1 2>/dev/null)" ]; then
            echo "::error::no published contract found; failing so the previous Pages site stays live"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      # Client-side password gate (deterrence only; data/v1 and the bundle stay public). With no
      # secret the build still succeeds, but the site fails closed: it shows "Site locked: password
      # not configured" and never renders the app.
      - name: Check the password hash secret
        env:
          FPL_PASSWORD_HASH: ${{ secrets.FPL_PASSWORD_HASH }}
        run: |
          if [ -z "${FPL_PASSWORD_HASH// }" ]; then
            echo "::warning title=FPL_PASSWORD_HASH not set::The FPL_PASSWORD_HASH secret is missing or empty. The deployed site will be LOCKED ('Site locked: password not configured'). See README: Password gate."
          elif ! printf '%s' "$FPL_PASSWORD_HASH" | tr -d '[:space:]' | grep -Eqi '^[0-9a-f]{64}$'; then
            echo "::warning title=FPL_PASSWORD_HASH malformed::FPL_PASSWORD_HASH is not a 64-character hex SHA-256; no password will unlock the site."
          fi

      - name: build
        working-directory: web
        env:
          VITE_FPL_PASSWORD_HASH: ${{ secrets.FPL_PASSWORD_HASH }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: [build, deploy]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Deploy
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
