# E7-S3: build the SPA and deploy the site + published data to GitHub Pages (NFR-01, free on a
# public repository — DL-12).
#
# `web/public/data/` is gitignored (it is generated, not source), so a build from a bare checkout
# has no data to serve. This workflow prefers the artefact pipeline.yml just uploaded (the freshest
# possible contract, from the run that triggered this deploy); if that is unavailable — e.g. a
# push-to-main deploy with no recent pipeline run — it falls back to a recent pipeline run that
# actually uploaded `web-data-contract`. Guard-only pipeline skips still report success but ship no
# artefact; treating those as "latest success" used to redeploy a dataless shell and wipe live week
# advice. If no contract can be restored, the build fails so actions/deploy-pages leaves the previous
# site live (DP-15, architecture §10.3).

name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Pipeline"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Day-before chain (day-before.yml): deploy only after a successful Pipeline run; a failed one
    # is skipped outright rather than redeploying an older contract.
    if: >-
      !(github.event_name == 'workflow_run'
        && contains(github.event.workflow_run.display_title, '[day-before')
        && github.event.workflow_run.conclusion != 'success')
    env:
      DAY_BEFORE: ${{ github.event_name == 'workflow_run' && contains(github.event.workflow_run.display_title, '[day-before') }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the data directory exists
        run: mkdir -p web/public/data/v1

      - name: Download the contract from the triggering pipeline run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-data-contract
          path: web/public/data/v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # The `data` branch has never carried a `web/v1` copy — it is rebuilt from bronze alone on
      # every ingest — so the previous fallback found nothing (DL-68). Prefer a recent successful
      # pipeline run that actually uploaded the contract (guard-only skips are "success" with none).
      # Day-before: only the contract that run just produced, and only if it is fresh. No fallback
      # to an older run's contract — that would be a stale deploy (#39: fail closed).
      - name: Day-before - require the fresh contract
        if: env.DAY_BEFORE == 'true'
        run: python pipeline/scripts/contract_fresh.py web/public/data/v1 --max-age-hours 6

      - name: Fall back to a recent pipeline run's contract
        if: env.DAY_BEFORE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -n "$(ls -A web/public/data/v1 2>/dev/null)" ]; then
            echo "contract already present from the triggering run's artifact"
            exit 0
          fi
          restored=""
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            if gh run download "$run_id" --name web-data-contract --dir web/public/data/v1; then
              echo "restored contract from pipeline run $run_id"
              restored=1
              break
            fi
            echo "::warning::pipeline run $run_id has no downloadable contract artefact"
          done < <(gh run list --workflow=pipeline.yml --status=success --limit=20 --json databaseId --jq '.[].databaseId')
          if [ -z "$restored" ] || [ -z "$(ls -A web/public/data/v1 2>/dev/null)" ]; then
            echo "::error::no published contract found; failing so the previous Pages site stays live"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      # Client-side password gate (deterrence only; data/v1 and the bundle stay public). With no
      # secret the build still succeeds, but the site fails closed: it shows "Site locked: password
      # not configured" and never renders the app.
      - name: Check the password hash secret
        env:
          FPL_PASSWORD_HASH: ${{ secrets.FPL_PASSWORD_HASH }}
        run: |
          if [ -z "${FPL_PASSWORD_HASH// }" ]; then
            echo "::warning title=FPL_PASSWORD_HASH not set::The FPL_PASSWORD_HASH secret is missing or empty. The deployed site will be LOCKED ('Site locked: password not configured'). See README: Password gate."
          elif ! printf '%s' "$FPL_PASSWORD_HASH" | tr -d '[:space:]' | grep -Eqi '^[0-9a-f]{64}$'; then
            echo "::warning title=FPL_PASSWORD_HASH malformed::FPL_PASSWORD_HASH is not a 64-character hex SHA-256; no password will unlock the site."
          fi

      - name: build
        working-directory: web
        env:
          VITE_FPL_PASSWORD_HASH: ${{ secrets.FPL_PASSWORD_HASH }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: [build, deploy]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Deploy
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
