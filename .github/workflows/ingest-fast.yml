# E7-S1: bootstrap-static and fixtures only — prices, status, ownership. Two cheap requests.
#
# GitHub Actions cron is static and cannot itself express "every 4h, hourly within 24h of a
# deadline, hourly while a gameweek is in play" (the cadence depends on the deadline and on FPL's
# flags, which the schedule does not know). So this fires hourly and asks
# `fpl-dof-schedule --decide fast` whether *this* firing should actually ingest — see
# pipeline/src/fpl_dof/week/schedule.py for the decision and why it is safe to ask often. A gameweek
# is in play from its deadline until FPL marks it data-checked (LIVE-02).
#
# `element-summary` never belongs here (see ingest-slow.yml) — it is ~700 requests and would turn
# an hourly job into the exact cost problem DL-12 closed.
#
# The rolling `data` branch (E7-S4, R-13) is rebuilt and force-pushed at the end of every ingest
# that actually fetched, by pipeline/scripts/retention.py — see pipeline/src/fpl_dof/retention.py
# for why the mechanism is "rebuild from nothing", not "delete the old file".
#
# A fetch that moved a price, a status or news line, a fixture, priced the Open gameweek for the
# first time, or saw a result then dispatches pipeline.yml with those kinds (ORC-02, DL-94). A result
# (`results`, LIVE-02, DL-99) is a matchday of the gameweek in play done (every match's bonus
# confirmed, or the settle cap passed), or the gameweek marked finished, or data-checked; this
# firing's captures are compared with the last ones, so whichever firing first sees one moves it,
# once, however many firings GitHub dropped before it (D-35). A kick-off or a goal moves nothing.

name: Ingest (fast)

on:
  schedule:
    - cron: "7 * * * *" # hourly at :07 (off the :00 peak GitHub sheds) — the guard decides whether to fetch
  workflow_dispatch:

concurrency:
  group: ingest-fast
  cancel-in-progress: false # a superseded run has nothing to gain by cancelling a cheap, fast one

permissions:
  contents: write # pushes the rebuilt `data` branch (R-13)
  actions: write # dispatches pipeline.yml on a material change (ORC-02)

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock

      - name: Install fpl-dof
        run: uv pip install --system -c pipeline/requirements.lock -e "pipeline[dev]"

      - name: Restore data from the `data` branch
        run: python pipeline/scripts/retention.py restore data


      - name: Should this firing ingest?
        id: schedule
        run: echo "run=$(fpl-dof-schedule --decide fast)" >> "$GITHUB_OUTPUT"

      - name: Fast ingest
        if: steps.schedule.outputs.run == 'true'
        env:
          # The owner's entry, picks and history are fetched *here*, at ingest — pipeline.yml
          # setting these alone left every run without an entry snapshot to transform (DL-69).
          # Non-secret public identifiers from repository variables, never committed (DL-44).
          FPL_DOF_TEAM_ID: ${{ vars.FPL_DOF_TEAM_ID }}
          FPL_DOF_LEAGUE_ID: ${{ vars.FPL_DOF_LEAGUE_ID }}
        run: fpl-dof ingest --fast

      - name: Rebuild the rolling `data` branch
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # The window is RetentionConfig.bronze_days, read by the script; immutable prior-season
          # snapshots are kept whatever their age (REM-10).
          python pipeline/scripts/retention.py rolling data/bronze --remote "$remote"

      # After `data` is pushed, so the run restores what this ingest fetched (ORC-02, DL-94).
      # Nothing moved, nothing dispatched; the pipeline's guard applies the freeze.
      - name: Start the pipeline on a material change
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python pipeline/scripts/dispatch_pipeline.py

  alert:
    needs: [ingest]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Ingest (fast)
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
