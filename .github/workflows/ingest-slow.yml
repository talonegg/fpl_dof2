# E7-S1: everything expensive — `element-summary` for every player (~700 requests, ~6 minutes at
# a polite rate) plus external sources on their own credit budgets. Daily, never on the fast path:
# this data changes at most once a day, and putting it on an hourly cadence was the single largest
# line in the minutes recount that led to DL-12.
#
# It ends by dispatching pipeline.yml with typed inputs (ORC-02): `day-before` when day-before.yml
# started it (`must_publish`), `change` with the kinds its change manifest moved, and otherwise the
# daily `schedule` refresh. A failed ingest stops before the dispatch, so nothing follows it.

name: Ingest (slow)
run-name: ${{ inputs.must_publish && 'Ingest (slow) [day-before]' || 'Ingest (slow)' }}

on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC — off-peak for both UK and AEST (odd minute: GitHub sheds :00/:30)
    - cron: "41 5 * * *" # fallback: each scheduled firing is a no-op once today's ingest succeeded
  workflow_dispatch:
    inputs:
      must_publish:
        description: "The day-before refresh (day-before.yml sets it): the pipeline run must publish."
        type: boolean
        default: false

concurrency:
  group: ingest-slow
  cancel-in-progress: false

permissions:
  contents: write # pushes the rebuilt `data` branch and the permanent snapshot archive (R-13)

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list for the fallback check
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock
      - name: Install fpl-dof
        if: github.event_name == 'schedule'
        run: uv pip install --system -c pipeline/requirements.lock -e pipeline
      # Every scheduled firing asks, so neither cron string is matched anywhere (ORC-02): the first
      # of the day finds nothing done, and the fallback finds the first's success.
      - name: Scheduled firing - skip if today's ingest already succeeded
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python pipeline/scripts/ci_runs.py today-done --workflow ingest-slow.yml --job ingest
            if grep -q '^done=true$' "$GITHUB_OUTPUT"; then
              echo "today's ingest already succeeded; fallback is a no-op"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  ingest:
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the `data` branch and the snapshot archive
      actions: write # dispatches pipeline.yml (ORC-02)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock

      - name: Install fpl-dof
        run: uv pip install --system -c pipeline/requirements.lock -e "pipeline[dev]"

      - name: Restore data from the `data` branch
        run: python pipeline/scripts/retention.py restore data


      - name: Full ingest (element-summary + external sources)
        # No ODDS_API_KEY: The Odds API is off by default (PIPE-09), so no step is handed a secret
        # it does not use.
        env:
          # See ingest-fast.yml: the entry is fetched at ingest, so the ID must reach it (DL-69).
          FPL_DOF_TEAM_ID: ${{ vars.FPL_DOF_TEAM_ID }}
          FPL_DOF_LEAGUE_ID: ${{ vars.FPL_DOF_LEAGUE_ID }}
        run: fpl-dof ingest

      - name: Rebuild the rolling `data` branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          python pipeline/scripts/retention.py rolling data/bronze --remote "$remote"

      # After `data` is pushed, so the run restores what this ingest fetched.
      - name: Start the pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          python pipeline/scripts/dispatch_pipeline.py --daily
          ${{ inputs.must_publish && '--day-before' || '' }}

      # One tarball per closed gameweek, written once (PIPE-14, DL-81). Fails, and so alerts, only
      # when bronze holds no gameweek schedule; a run with no newly closed gameweek writes nothing.
      - name: Archive each closed gameweek's bronze to `snapshots` (E7-S4, NFR-06)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          python pipeline/scripts/retention.py archive data/bronze --remote "$remote"

  alert:
    needs: [guard, ingest]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Ingest (slow)
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
