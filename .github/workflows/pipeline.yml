# E7-S2: transform → gates → forecast → optimise → week (every strategy's week and plan, MOD-04)
# → publish → deploy (deploy.yml, called as the last job only when this run published, ORC-03).
# Deliberately *not* ingest (that is ingest-fast.yml / ingest-slow.yml's job). An ingest starts a
# run when its change manifest moved anything material, with no thresholds (DL-94 item 4).
#
# Triggers (ORC-02): one scheduled tick, and dispatch with typed inputs. Nothing here follows
# another workflow by name, title or cron string (test_dispatch.py pins that):
#
# - **The tick** (`7,23,41,53 * * * *`) asks fpl-dof-schedule whether the Open gameweek is in a
#   pre-deadline window (T-6h, T-3h, T-90m, T-45m). GitHub Actions cron cannot itself depend on when
#   the next deadline is, so it fires often and the guard decides, as ingest-fast.yml does.
# - **`change`**: an ingest whose change manifest moved a price, a status or news line, a fixture,
#   or priced the Open gameweek for the first time dispatches a run with those kinds (DL-94).
# - **`schedule`**: the slow ingest's daily refresh, dispatched after it pushed `data`.
# - **`day-before`**: the slow ingest that day-before.yml started; `must_publish` makes deploy fail
#   closed on a stale contract.
# - **`manual`**: the owner, from the Actions tab.
#
# **Nothing here may run inside 45 minutes of a deadline (R-09), whatever started it.** The guard
# (`fpl_dof.week.schedule.dispatch_decision`) enforces this for every trigger; this workflow file
# does not duplicate that logic and must not be changed to bypass it under pressure.

name: Pipeline
run-name: ${{ inputs.trigger && format('Pipeline [{0}]', inputs.trigger) || 'Pipeline' }}

on:
  schedule:
    # Odd minutes, off the :00/:30 peaks GitHub sheds (schedule hardening, 2026-10-14).
    - cron: "7,23,41,53 * * * *" # the tick: longest gap 18 min, see ScheduleConfig
  workflow_dispatch:
    inputs:
      trigger:
        description: "What started this run (ORC-02). The ingests send change, schedule or day-before."
        type: choice
        options: [manual, change, schedule, day-before]
        default: manual
      kinds:
        description: "For change: the change manifest's kinds, comma-separated (prices,status,fixtures,odds)."
        required: false
        type: string
      gameweek:
        description: "The gameweek this run was started for; refused unless it is still the Open one. Blank for any."
        required: false
        type: string
      must_publish:
        description: "This run must publish a fresh contract, or deploy fails closed (the day-before refresh)."
        type: boolean
        default: false
      team_id:
        description: "FPL team ID override for this run only (E13-S3). Leave blank to use the FPL_DOF_TEAM_ID repository variable."
        required: false
        type: string
      league_id:
        description: "FPL mini-league ID override for this run only (E13-S3). Leave blank to use the FPL_DOF_LEAGUE_ID repository variable."
        required: false
        type: string

concurrency:
  # `cancel-in-progress: false` is deliberate (E7-S4, NFR-06, R-13): a run in progress is left to
  # finish rather than killed mid-stage (stages are independently resumable, but a half-finished
  # publish must never race a fresh one — Invariant 7). With a single group and queueing disabled
  # for in-progress runs, GitHub Actions still only starts the *newest* queued run once the current
  # one finishes; older queued runs are superseded, which is "one at a time, newer wins" without
  # cancelling active work.
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # Every trigger passes through the guard (ORC-02): it validates the typed inputs, refuses
    # unknown values, and applies the freeze and the Open-gameweek check to a dispatched run too.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      trigger: ${{ steps.decide.outputs.trigger }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock
      # Only what the schedule decision and the restore import (ORC-09): no solver, no models.
      - run: |
          uv pip install --system -c pipeline/requirements.lock pandas pandera pyarrow pydantic pyyaml httpx
          uv pip install --system -c pipeline/requirements.lock --no-deps -e pipeline
      - name: Restore data from the `data` branch
        run: python pipeline/scripts/retention.py restore data

      # An invalid input fails this step, and so alerts: a wiring fault, never a silent skip.
      - name: Decide whether to run
        id: decide
        env:
          TRIGGER: ${{ inputs.trigger }}
          KINDS: ${{ inputs.kinds }}
          GAMEWEEK: ${{ inputs.gameweek }}
        run: |
          run="$(fpl-dof-schedule --decide pipeline --trigger "$TRIGGER" --kinds "$KINDS" --gameweek "$GAMEWEEK")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          case "$TRIGGER" in
            "") stamp=schedule ;;
            change) stamp="change:$KINDS" ;;
            *) stamp="$TRIGGER" ;;
          esac
          echo "trigger=$stamp" >> "$GITHUB_OUTPUT"

  run:
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Measured 2026-10-23: local run 360 s, of which the week stage 271 s; the runner is slower.
    timeout-minutes: 45
    permissions:
      contents: write # appends this run's advice to the `ledger` branch (DL-69)
    outputs:
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install fpl-dof
        run: uv pip install --system -c pipeline/requirements.lock -e pipeline

      - name: Restore data from the `data` branch
        run: python pipeline/scripts/retention.py restore data


      # The advice ledger (DL-69): what earlier runs advised, per gameweek, so this run can
      # reconcile last week's advice against what was played and publish the season log. Gold is
      # not persisted between runs; this branch is. `evaluation/` holds each finished gameweek's
      # judgement, made once (ORC-05): restored, a gameweek is Evaluated and is not judged again.
      # `experiments/` holds the standing backtest's records, which the model card reads for the
      # champion's current digest (MOD-08), and `models_history/` the seasons it simulated, which
      # publish turns into models_history.json (ORC-06).
      - name: Restore the advice ledger and experiments from the `ledger` branch
        run: |
          set -eu
          mkdir -p data/ledger
          if git ls-remote --exit-code --heads origin ledger >/dev/null 2>&1; then
            git fetch --depth=1 origin ledger:refs/remotes/origin/ledger
            git worktree add /tmp/ledger-branch origin/ledger
            for kept in advice predictions evaluation experiments models_history; do
              if [ -d "/tmp/ledger-branch/$kept" ]; then
                mkdir -p "data/ledger/$kept"
                cp -r "/tmp/ledger-branch/$kept/." "data/ledger/$kept/"
              fi
            done
            # The retired frozen harness's last record (DL-87): read-only, so the app keeps showing
            # the frozen history up to the switch gameweek. Nothing writes to it any more.
            latest="$(ls /tmp/ledger-branch/prospective/gw[0-9][0-9].tgz 2>/dev/null | sort | tail -n 1 || true)"
            if [ -n "$latest" ]; then
              mkdir -p "$RUNNER_TEMP/prospective-record"
              tar -xzf "$latest" -C "$RUNNER_TEMP/prospective-record"
            fi
            git worktree remove /tmp/ledger-branch --force
          fi

      # PIPE-11, REM-10: a torn or corrupt snapshot is moved to data/quarantine/ before transform
      # reads bronze, and the step lists it by path. Anything verify cannot move aside fails here.
      - name: Verify bronze before transform
        run: fpl-dof bronze verify --quarantine

      # Runs the exact E0 code path (D-10): `fpl-dof run --only ...`, no CI-only branch anywhere.
      - name: Run the pipeline (transform through publish)
        env:
          # Non-secret public identifiers, sourced from repository variables (Invariant 10,
          # DL-44) — never committed config. Unset is fine: EntryConfig.team_id/league_id default
          # to None and the run falls back to a declared squad / no league respectively.
          FPL_DOF_TEAM_ID: ${{ inputs.team_id || vars.FPL_DOF_TEAM_ID }}
          FPL_DOF_LEAGUE_ID: ${{ inputs.league_id || vars.FPL_DOF_LEAGUE_ID }}
          FPL_DOF_MODELS_SOURCE_DIR: ${{ runner.temp }}/prospective-record
          # Stamped on every advice (ORC-03, DL-94): the guard's reading of the typed inputs.
          FPL_DOF_TRIGGER: ${{ needs.guard.outputs.trigger }}
        run: >
          fpl-dof run
          --only transform quality forecast optimise week publish

      # Deploy follows only a run that published (ORC-03): a failed stage stops the job before
      # this step, and a guard-only run never reaches it.
      - name: Mark the run as published
        id: published
        run: |
          test -f data/web/v1/meta.json
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload the published web contract
        uses: actions/upload-artifact@v4
        with:
          name: web-data-contract
          path: data/web/v1
          retention-days: 14

      # Append-only, through the same mechanism that keeps `snapshots` (E7-S4): identical bytes
      # are a no-op, so re-running inside a gameweek only rewrites the file that changed, and a
      # gameweek whose deadline has passed is never advised again and therefore never rewritten.
      - name: Record this run's advice on the `ledger` branch (DL-69)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          shopt -s nullglob
          for file in data/ledger/advice/gw*.json; do
            name="$(basename "$file" .json)"
            gameweek="$((10#${name#gw}))"
            python pipeline/scripts/retention.py permanent "$file" \
              --remote "$remote" --branch ledger --source advice --gameweek "$gameweek" \
              --checkout-dir .ledger-staging
          done
          # Each strategy's forecast for the gameweek, replaced by its next success (ORC-08).
          for file in data/ledger/predictions/gw*/*.parquet; do
            week="$(basename "$(dirname "$file")")"
            python pipeline/scripts/retention.py permanent "$file" \
              --remote "$remote" --branch ledger --source "predictions/$week" \
              --name "$(basename "$file" .parquet)" --replace --checkout-dir .ledger-staging
          done
          # Each finished gameweek's evaluation (ORC-05): written once, rewritten only when the
          # scorer's version changes, so an unchanged file is a no-op here.
          for file in data/ledger/evaluation/gw*.json; do
            name="$(basename "$file" .json)"
            python pipeline/scripts/retention.py permanent "$file" \
              --remote "$remote" --branch ledger --source evaluation --gameweek "$((10#${name#gw}))" \
              --checkout-dir .ledger-staging
          done

      - name: Rebuild the rolling `data` branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          python pipeline/scripts/retention.py rolling data/bronze --remote "$remote"

  # The last job: deploy this run's own contract, and only when this run published (ORC-03,
  # DL-94). A guard-only or failed run deploys nothing and the previous site stays live.
  deploy:
    needs: [guard, run]
    if: needs.run.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      from_pipeline: true
      must_publish: ${{ inputs.must_publish == true }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      issues: write # deploy.yml's own failure alert

  # From the run's start to its last job, against schedule.pipeline_run_budget_seconds (ORC-09).
  budget:
    needs: [run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: pipeline/requirements.lock
      - run: uv pip install --system -c pipeline/requirements.lock pandas pydantic pyyaml
      - name: Pipeline run within its budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/scripts/ci_runs.py budget pipeline_run_budget_seconds

  alert:
    needs: [guard, run, budget]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Pipeline
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
