# E7-S2: transform → gates → forecast → optimise → week → decision → publish. Deliberately *not*
# ingest (that is ingest-fast.yml / ingest-slow.yml's job) and deliberately not run after every
# fast ingest — re-solving because a price moved £0.10 is waste (architecture §9).
#
# Triggers: nightly, after ingest-slow, at T-3h/T-45m before a deadline, and manual dispatch. The
# deadline-relative trigger is a static 15-minute cron plus a guard step, for the same reason
# ingest-fast.yml is hourly-plus-a-guard: GitHub Actions cron cannot itself depend on when the next
# deadline is. See pipeline/src/fpl_dof/week/schedule.py — R-09's freeze and the one-sided window
# shape that keeps the T-45m trigger from ever landing inside it are enforced there, not here.
#
# **Nothing here may run inside 45 minutes of a deadline (R-09).** The guard enforces this; this
# workflow file does not duplicate that logic and must not be changed to bypass it under pressure.

name: Pipeline
# A run that follows the day-before ingest carries "[day-before]" so Deploy can apply its stricter
# fail-closed rules (see day-before.yml).
run-name: >-
  ${{ github.event_name == 'workflow_run' && contains(github.event.workflow_run.display_title, '[day-before')
  && 'Pipeline [day-before]' || 'Pipeline' }}

on:
  schedule:
    # Schedule hardening (2026-10-14): GitHub drops and delays cron firings on this repo, worst at
    # :00/:30. Every cron is on odd minutes, and the nightly run has a fallback firing.
    - cron: "11 1 * * *" # nightly, unconditional
    - cron: "47 3 * * *" # nightly fallback: no-op if today's nightly `run` job already succeeded
    - cron: "7,23,41,53 * * * *" # deadline-relative guard (longest gap 18 min) — see ScheduleConfig
  workflow_run:
    workflows: ["Ingest (slow)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      team_id:
        description: "FPL team ID override for this run only (E13-S3). Leave blank to use the FPL_DOF_TEAM_ID repository variable."
        required: false
        type: string
      league_id:
        description: "FPL mini-league ID override for this run only (E13-S3). Leave blank to use the FPL_DOF_LEAGUE_ID repository variable."
        required: false
        type: string

concurrency:
  # `cancel-in-progress: false` is deliberate (E7-S4, NFR-06, R-13): a run in progress is left to
  # finish rather than killed mid-stage (stages are independently resumable, but a half-finished
  # publish must never race a fresh one — Invariant 7). With a single group and queueing disabled
  # for in-progress runs, GitHub Actions still only starts the *newest* queued run once the current
  # one finishes; older queued runs are superseded, which is "one at a time, newer wins" without
  # cancelling active work.
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # Always runs; the decide step below is what actually branches. Only the 15-minute
    # deadline-relative cron consults fpl-dof-schedule — the nightly cron, the post-ingest-slow
    # trigger, and manual dispatch proceed unconditionally (they are not deadline-relative, so
    # there is no window to be inside or outside of).
    permissions:
      contents: read
      actions: read # gh run view/list for the upstream-ingest and fallback checks
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      day_before: ${{ steps.decide.outputs.day_before }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: python -m pip install -e pipeline
      - name: Restore bronze and silver from the `data` branch
        run: |
          set -eu
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add /tmp/data-branch origin/data
            for tier in bronze silver; do
              if [ -d "/tmp/data-branch/$tier" ]; then cp -r "/tmp/data-branch/$tier" "data/$tier"; fi
            done
            git worktree remove /tmp/data-branch --force
          fi
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DAY_BEFORE: ${{ github.event_name == 'workflow_run' && contains(github.event.workflow_run.display_title, '[day-before') }}
          UPSTREAM_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "day_before=$DAY_BEFORE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_run" ]; then
            # What the triggering Ingest (slow) run's `ingest` job actually did. A fallback firing
            # that found today's ingest already done skips that job: nothing new, so no rerun.
            ingest="$(gh run view "$UPSTREAM_ID" --repo "${{ github.repository }}" --json jobs \
              --jq '.jobs[] | select(.name == "ingest") | .conclusion' 2>/dev/null || echo unknown)"
            echo "upstream ingest job: ${ingest:-none}"
            if [ "$ingest" = "skipped" ]; then
              echo "upstream ingest was a fallback no-op; nothing to refresh"
              echo "run=false" >> "$GITHUB_OUTPUT"
            elif [ "$DAY_BEFORE" = "true" ] && [ "$ingest" != "success" ]; then
              # Fail closed: never refresh models on a failed (or unknown) day-before ingest.
              echo "::warning title=Day-before refresh skipped::the day-before ingest job concluded '${ingest:-none}'; not running the pipeline"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "7,23,41,53 * * * *" ]; then
            echo "run=$(fpl-dof-schedule --decide pipeline)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "47 3 * * *" ]; then
            python pipeline/scripts/ci_runs.py today-done --workflow pipeline.yml --job run
            if grep -q '^done=true$' "$GITHUB_OUTPUT"; then
              echo "nightly already succeeded today; fallback is a no-op"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The five frozen prospective models (engine, C3, C1, A, A+odds; tag frozen-2026-10-13). Runs the
  # frozen harness unmodified from the vendored content bundle, checked file-by-file against the
  # manifest's hashes. Fail closed, but never blocks the champion: `continue-on-error` here, and
  # every model whose inputs are stale or missing is marked unavailable in status/GW{n}.json, so
  # the published models.json never shows it with partial data. See prospective/README.md.
  prospective:
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write # appends the prospective record to the `ledger` branch
    env:
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      # The harness hardcodes the paths it was frozen at; recreate them rather than edit it.
      - name: Extract the frozen bundle to its frozen paths
        run: |
          set -eu
          sudo mkdir -p /workspace && sudo chown "$USER" /workspace
          tar -xzf prospective/bundle/frozen-2026-10-13.tar.gz -C /tmp
          mv /tmp/frozen /workspace/fpl_dof2_frozen
          mv /tmp/harness /workspace/fpl_prospective
          python -m venv /workspace/fpl_dof2/.venv
          /workspace/fpl_dof2/.venv/bin/python -m pip install -q -e /workspace/fpl_dof2_frozen/pipeline
          python -m pip install -q -e "pipeline[dev]"

      - name: Restore the prospective record from the `ledger` branch
        run: |
          set -eu
          if git ls-remote --exit-code --heads origin ledger >/dev/null 2>&1; then
            git fetch --depth=1 origin ledger:refs/remotes/origin/ledger
            git worktree add /tmp/ledger-branch origin/ledger
            latest="$(ls /tmp/ledger-branch/prospective/gw*.tgz 2>/dev/null | sort | tail -n 1 || true)"
            if [ -n "$latest" ]; then python pipeline/scripts/prospective_ci.py unpack "$latest"; fi
            git worktree remove /tmp/ledger-branch --force
          fi

      - name: Verify the bundle and fetch the odds history
        run: python pipeline/scripts/prospective_ci.py prepare

      - name: Plan (decide inside 36h of the deadline; score finished gameweeks)
        id: plan
        run: python pipeline/scripts/prospective_ci.py plan

      # The latest provisional preview for this gameweek (written by a day-before run), so every
      # run until the frozen decision keeps publishing it. Cache only; never the ledger.
      - name: Restore the provisional preview
        if: steps.plan.outputs.gw != '' && steps.plan.outputs.gw != '0'
        uses: actions/cache/restore@v4
        with:
          path: /workspace/fpl_prospective/preview
          key: prospective-preview-gw${{ steps.plan.outputs.gw }}-${{ github.run_id }}
          restore-keys: prospective-preview-gw${{ steps.plan.outputs.gw }}-

      # The day-before refresh never writes a frozen decision early: decide is forced to false (and
      # recorded in plan.json) on that path. Every other trigger passes the plan through unchanged.
      - name: Day-before veto on deciding
        id: window
        env:
          DAY_BEFORE: ${{ needs.guard.outputs.day_before }}
          PLANNED: ${{ steps.plan.outputs.decide }}
        run: |
          if [ "$DAY_BEFORE" = "true" ]; then
            python pipeline/scripts/day_before_gate.py --veto-plan /workspace/fpl_prospective/ci/plan.json
            echo "decide=false" >> "$GITHUB_OUTPUT"
          else
            echo "decide=$PLANNED" >> "$GITHUB_OUTPUT"
          fi

      # Only on deciding runs (once per gameweek). The community archive is immutable per season,
      # so its bronze is cached; the live season is re-fetched every time.
      - name: Cache archive bronze
        if: steps.window.outputs.decide == 'true' || needs.guard.outputs.day_before == 'true'
        uses: actions/cache@v4
        with:
          path: /workspace/fpl_prospective/data/bronze/fplarchive
          key: fplarchive-bronze-2023-2026-v1

      - name: Refresh silver (FPL API + xG/xA + archive backfill)
        if: steps.window.outputs.decide == 'true' || needs.guard.outputs.day_before == 'true'
        env:
          FPL_DOF_CONFIG_FILE: config/ci-backtest.yaml
        run: |
          set +e
          fpl-dof --data-dir /workspace/fpl_prospective/data ingest && \
            fpl-dof --data-dir /workspace/fpl_prospective/data transform
          ok=$([ $? -eq 0 ] && echo 1 || echo 0)
          python pipeline/scripts/prospective_ci.py silver --ok "$ok"

      - name: Score finished gameweeks (frozen score.py)
        if: steps.plan.outputs.score == 'true'
        working-directory: /workspace/fpl_prospective
        run: /workspace/fpl_dof2/.venv/bin/python score.py

      # Per-player xP accuracy (prospective/PREREG_C1_vs_C3.md). Not frozen code and never a gate:
      # it reads the hashed xP files decide.py kept and writes xp_scores*.csv / xp_calibration.csv.
      - name: Score per-player xP accuracy (score_xp.py)
        if: steps.plan.outputs.score == 'true'
        continue-on-error: true
        run: python pipeline/scripts/score_xp.py

      - name: Decide the next gameweek (frozen decide.py)
        if: steps.window.outputs.decide == 'true'
        working-directory: /workspace/fpl_prospective
        env:
          FPL_DOF_TEAM_ID: ${{ inputs.team_id || vars.FPL_DOF_TEAM_ID }}
        run: |
          # decide.py writes state/<model>.json but never creates state/ (run 38974140926).
          mkdir -p /workspace/fpl_prospective/state /workspace/fpl_prospective/decisions
          /workspace/fpl_dof2/.venv/bin/python decide.py

      # Provisional advice so every model shows on the Models page before its frozen decision.
      # Day-before refresh runs only (once per gameweek) to bound CI cost. Runs the frozen
      # decide.py --dry-run against a scratch copy of the harness root; writes preview/GW{n}.json,
      # which is not part of the record (never packed to `ledger`) and is verified not to touch it.
      - name: Provisional preview (dry run, scratch copy)
        id: preview
        if: needs.guard.outputs.day_before == 'true' && steps.window.outputs.decide != 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          FPL_DOF_TEAM_ID: ${{ inputs.team_id || vars.FPL_DOF_TEAM_ID }}
        run: python pipeline/scripts/prospective_ci.py preview

      - name: Keep the provisional preview for later runs
        if: steps.preview.outcome == 'success'
        continue-on-error: true # nothing to save when the preview was skipped
        uses: actions/cache/save@v4
        with:
          path: /workspace/fpl_prospective/preview
          key: prospective-preview-gw${{ steps.plan.outputs.gw }}-${{ github.run_id }}

      - name: Record input freshness for new decisions (fail closed)
        if: always()
        run: python pipeline/scripts/prospective_ci.py status

      - name: Pack the record
        if: always()
        run: python pipeline/scripts/prospective_ci.py pack "$RUNNER_TEMP/prospective.tgz"

      # Identical bytes are a no-op; decisions inside the tarball are create-only by the harness.
      - name: Record on the `ledger` branch
        if: always() && steps.plan.outputs.gw != '' && steps.plan.outputs.gw != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          python pipeline/scripts/retention.py permanent "$RUNNER_TEMP/prospective.tgz" \
            --remote "$remote" --branch ledger --source prospective \
            --gameweek "${{ steps.plan.outputs.gw }}" --checkout-dir .ledger-staging

      - name: Hand the record to the publish job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-record
          # Record paths only, never the silver/bronze under data/.
          path: |
            /workspace/fpl_prospective/decisions/
            /workspace/fpl_prospective/status/
            /workspace/fpl_prospective/preview/
            /workspace/fpl_prospective/scores.csv
            /workspace/fpl_prospective/report.md
            /workspace/fpl_prospective/xp_scores.csv
            /workspace/fpl_prospective/xp_scores_paired.csv
            /workspace/fpl_prospective/xp_calibration.csv
          if-no-files-found: ignore
          retention-days: 7

  run:
    needs: [guard, prospective]
    # The champion never waits on the frozen models: run whatever the prospective job did.
    if: always() && needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # appends this run's advice to the `ledger` branch (DL-69)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install fpl-dof
        run: python -m pip install -e "pipeline[dev]"

      - name: Restore bronze and silver from the `data` branch
        run: |
          set -eu
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add /tmp/data-branch origin/data
            for tier in bronze silver; do
              if [ -d "/tmp/data-branch/$tier" ]; then cp -r "/tmp/data-branch/$tier" "data/$tier"; fi
            done
            git worktree remove /tmp/data-branch --force
          fi

      # The advice ledger (DL-69): what earlier runs advised, per gameweek, so this run can
      # reconcile last week's advice against what was played and publish the season log. Gold is
      # not persisted between runs; this branch is.
      - name: Restore the advice ledger from the `ledger` branch
        run: |
          set -eu
          mkdir -p data/ledger
          if git ls-remote --exit-code --heads origin ledger >/dev/null 2>&1; then
            git fetch --depth=1 origin ledger:refs/remotes/origin/ledger
            git worktree add /tmp/ledger-branch origin/ledger
            if [ -d /tmp/ledger-branch/advice ]; then
              mkdir -p data/ledger/advice
              cp -r /tmp/ledger-branch/advice/. data/ledger/advice/
            fi
            git worktree remove /tmp/ledger-branch --force
          fi

      # No record (prospective job failed) → models.json lists every frozen model as unavailable.
      - name: Fetch the prospective record
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prospective-record
          path: prospective-record

      # Runs the exact E0 code path (D-10): `fpl-dof run --only ...`, no CI-only branch anywhere.
      - name: Run the pipeline (transform through publish)
        env:
          # Non-secret public identifiers, sourced from repository variables (Invariant 10,
          # DL-44) — never committed config. Unset is fine: EntryConfig.team_id/league_id default
          # to None and the run falls back to a declared squad / no league respectively.
          FPL_DOF_TEAM_ID: ${{ inputs.team_id || vars.FPL_DOF_TEAM_ID }}
          FPL_DOF_LEAGUE_ID: ${{ inputs.league_id || vars.FPL_DOF_LEAGUE_ID }}
          FPL_DOF_MODELS_SOURCE_DIR: ${{ github.workspace }}/prospective-record
        run: >
          fpl-dof run
          --only transform quality forecast optimise week decision publish

      - name: Upload the published web contract
        uses: actions/upload-artifact@v4
        with:
          name: web-data-contract
          path: data/web/v1
          retention-days: 14

      # Append-only, through the same mechanism that keeps `snapshots` (E7-S4): identical bytes
      # are a no-op, so re-running inside a gameweek only rewrites the file that changed, and a
      # gameweek whose deadline has passed is never advised again and therefore never rewritten.
      - name: Record this run's advice on the `ledger` branch (DL-69)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          shopt -s nullglob
          for file in data/ledger/advice/gw*.json; do
            name="$(basename "$file" .json)"
            gameweek="$((10#${name#gw}))"
            python pipeline/scripts/retention.py permanent "$file" \
              --remote "$remote" --branch ledger --source advice --gameweek "$gameweek" \
              --checkout-dir .ledger-staging
          done

  alert:
    needs: [guard, run]
    if: failure()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      workflow_name: Pipeline
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
