# Configuration for the weekly CI backtest only (DL-68). Selected by `FPL_DOF_CONFIG_FILE` in
# `.github/workflows/backtest.yml`; the `run` job does not read it, so the live pipeline's behaviour is unchanged by anything here.
#
# The archive and its backfill seasons are now the shipped defaults (DL-87), so only the backtest's
# own training window is set here. Nothing in this file is a secret. It is committed because a
# backtest that only a gitignored workstation file can run is not a scheduled regression (DP-12).
backtest:
  training_seasons:
    - 2024/25
    - 2025/26
