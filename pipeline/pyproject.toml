[project]
name = "fpl-dof"
version = "0.1.0"
description = "FPL DOF pipeline — ingest, conform, forecast, optimise, publish."
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    # The multi-gameweek solver from E4 onward (DL-15, DL-26). Not optional: the horizon model
    # refuses to fall back to CBC silently, so an environment without this cannot plan.
    "highspy>=1.15",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "numpy>=2.2",
    "pandas>=2.2",
    "pandera>=0.22",
    # Capped: PuLP 4 removed LpVariable.dicts, which both optimisers use (DL-71).
    "pulp>=3.0,<4",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    # The shadow monolith the backtest reports against on every run (E10-S5, DL-53). Free, open
    # source and pure-wheel on every platform the scheduled runner uses, which is the whole reason
    # it is scikit-learn and not LightGBM (Invariant 3, NFR-01). Not optional: a benchmark that is
    # only present when an extra was installed is a benchmark that silently stops being reported.
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.120",
    "import-linter==2.15",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "respx>=0.22",
    "ruff>=0.9",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[project.scripts]
fpl-dof = "fpl_dof.cli:main"
# The read-only guard the scheduled workflows ask before doing anything (E7-S1, E7-S2). Separate
# from `fpl-dof` because that command opens a run and writes a manifest, which is wrong for a
# question asked ninety-six times a day.
fpl-dof-schedule = "fpl_dof.schedule_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_dof"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = ["A005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pulp.*", "pandera.*", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here: CI passes -q itself, and -q twice (-qq) suppresses the summary line.
addopts = "--strict-markers"
# Generous per-test ceiling so a genuine hang fails with a traceback instead of stalling the job.
timeout = 120
markers = [
    "network: hits the live FPL API; deselected by default in CI",
    "slow: measured in minutes, not seconds; deselected by default. Run with --slow",
]
filterwarnings = [
    "ignore:.*LpVariable.dicts is deprecated.*:DeprecationWarning",
    "ignore:.*PULP_CBC_CMD is deprecated.*:DeprecationWarning",
    "ignore:Unknown config option. timeout:pytest.PytestConfigWarning",
]

[tool.coverage.run]
branch = true
source = ["src/fpl_dof"]

# Module boundaries (MOD-01, DL-86, DL-87; target in docs/planning/05-target-architecture.md §3).
# Logical modules: data platform = sources, silver, quality; core = rules, squad, optimise,
# decision; model factory = factory, forecast, shadow, prospective; orchestrator = stages,
# pipeline, cli, week, publish, schedule_cli. config, obs, frames, paths, retention and gold are
# shared and unconstrained. Data platform may import core (sources and silver read rules, as
# today); core imports neither data platform, factory nor orchestrator; factory may import core
# but not the orchestrator; nothing but pipeline and cli imports stages; the orchestrator reaches
# the factory only through fpl_dof.factory, the registry interface (MOD-03). ignore_imports is the
# allow-list of today's violations, each naming the story that removes it: it only shrinks (a
# ratchet), and is empty before R1.2.2 promotes. An entry that no longer matches an import fails
# the run, so a fixed violation must be deleted here.
[tool.importlinter]
root_package = "fpl_dof"

[[tool.importlinter.contracts]]
name = "Core imports nothing from the data platform, the model factory or the orchestrator"
type = "forbidden"
source_modules = ["fpl_dof.rules", "fpl_dof.squad", "fpl_dof.optimise", "fpl_dof.decision"]
forbidden_modules = [
    "fpl_dof.sources", "fpl_dof.silver", "fpl_dof.quality",
    "fpl_dof.factory", "fpl_dof.forecast", "fpl_dof.shadow", "fpl_dof.prospective",
    "fpl_dof.stages", "fpl_dof.pipeline", "fpl_dof.cli", "fpl_dof.week", "fpl_dof.publish",
    "fpl_dof.schedule_cli",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "The data platform knows no model and no orchestration"
type = "forbidden"
source_modules = ["fpl_dof.sources", "fpl_dof.silver", "fpl_dof.quality"]
forbidden_modules = [
    "fpl_dof.factory", "fpl_dof.forecast", "fpl_dof.shadow", "fpl_dof.prospective",
    "fpl_dof.stages", "fpl_dof.pipeline", "fpl_dof.cli", "fpl_dof.week", "fpl_dof.publish",
    "fpl_dof.schedule_cli",
]

[[tool.importlinter.contracts]]
name = "The model factory never imports the orchestrator"
type = "forbidden"
source_modules = ["fpl_dof.factory", "fpl_dof.forecast", "fpl_dof.shadow", "fpl_dof.prospective"]
forbidden_modules = [
    "fpl_dof.stages", "fpl_dof.pipeline", "fpl_dof.cli", "fpl_dof.week", "fpl_dof.publish",
    "fpl_dof.schedule_cli",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "The orchestrator reaches the model factory only through fpl_dof.factory"
type = "forbidden"
source_modules = [
    "fpl_dof.stages", "fpl_dof.week", "fpl_dof.publish", "fpl_dof.pipeline", "fpl_dof.cli",
]
forbidden_modules = ["fpl_dof.forecast", "fpl_dof.shadow", "fpl_dof.prospective"]
allow_indirect_imports = true
ignore_imports = [
    "fpl_dof.stages.backtest -> fpl_dof.forecast.backtest",  # MOD-08: the standing backtest runs strategies through the registry
    "fpl_dof.stages.backtest -> fpl_dof.forecast.xp_v1",  # MOD-08: the standing backtest runs strategies through the registry
]

[[tool.importlinter.contracts]]
name = "Only pipeline and cli import stages"
type = "forbidden"
source_modules = [
    "fpl_dof.rules", "fpl_dof.squad", "fpl_dof.optimise", "fpl_dof.decision",
    "fpl_dof.sources", "fpl_dof.silver", "fpl_dof.quality",
    "fpl_dof.factory", "fpl_dof.forecast", "fpl_dof.shadow", "fpl_dof.prospective",
    "fpl_dof.week", "fpl_dof.publish", "fpl_dof.schedule_cli",
]
forbidden_modules = ["fpl_dof.stages"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Stages do not import each other"
type = "independence"
modules = [
    "fpl_dof.stages.backtest", "fpl_dof.stages.forecast",
    "fpl_dof.stages.ingest", "fpl_dof.stages.optimise", "fpl_dof.stages.publish",
    "fpl_dof.stages.quality", "fpl_dof.stages.transform", "fpl_dof.stages.week",
]
ignore_imports = []
