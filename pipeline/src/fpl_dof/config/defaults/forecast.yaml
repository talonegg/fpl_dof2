# The expected-points models and the squad optimiser.
#
# Every number here is a modelling choice, not a game rule. Game rules come from the API and live
# in the rules module; nothing in this file is an FPL constant.
#
# The values are priors chosen before any backtest exists (debt D-01). They are meant to be tuned
# once E3 can measure whether tuning helps. Changing one without evidence is a decision, and
# should be recorded as one.
forecast:
  horizon_gameweeks: 6
  horizon_discount: 0.92

  # Defensive Contribution was introduced in 2025/26. Earlier seasons report zero because the
  # metric did not exist. Reading that as "did not defend" would systematically underrate
  # defenders and defensive midfielders — the exact group the design says the model should beat
  # intuition on.
  defensive_contribution_seasons: ["2025/26"]
  # Same trap, different field: starts are not recorded before 2022/23.
  starts_recorded_from_season: "2022/23"

  max_history_seasons: 3
  season_recency_decay: 0.6

  confidence_minutes_high: 1800
  confidence_minutes_medium: 600
  price_tiers: 4

  # E0-S5 acceptance criterion, not a preference.
  minimum_start_probability_for_xi: 0.60

  status_multiplier:
    a: 1.0 # available
    d: 0.5 # doubtful
    i: 0.0 # injured
    s: 0.0 # suspended
    u: 0.0 # unavailable
    n: 0.0 # not in squad

  minutes:
    full_match: 90
    team_games_per_season: 38
    starter_minutes: 82.0
    substitute_minutes: 20.0
    appearance_rate_if_not_starting: 0.35

  shrinkage:
    rate_prior_minutes: 900.0
    start_prior_games: 10.0

  # FPL's own 1-5 fixture difficulty. Defence swings harder than attack because a clean sheet is a
  # threshold event. Replaced by an xG-based model in E3 (debt D-05).
  fixture_difficulty:
    attack: { 1: 1.15, 2: 1.08, 3: 1.00, 4: 0.92, 5: 0.85 }
    defence: { 1: 1.30, 2: 1.14, 3: 1.00, 4: 0.86, 5: 0.72 }

  # Wide on purpose (Invariant 6). A heuristic band, not a modelled variance (debt D-09).
  uncertainty:
    coefficient_of_variation:
      high: 0.45
      medium: 0.60
      low: 0.80
      none: 1.00
    floor: 0.5

  # Observe goal involvement through expected goals rather than actual (D-25, DL-34). The pydantic
  # default is off — the mechanism ships dark (DP-08) — and this promotes it because the walk-forward
  # backtest measured it earning its place: over the same 72 folds / 21,712 observations, Spearman
  # 0.22545 -> 0.23070, MAE 1.94547 -> 1.92655, MAE-skill over B0 0.00994 -> 0.01957, calibration
  # slope 0.597 -> 0.701. The verdict is unchanged (beats B0, loses to model-free, top-20 precision
  # 0.00), so D-13 stands; this is a real but modest improvement, not a breakthrough.
  #
  # team_strength_from_xg stays off: M2's ratings do not touch player goal rates in xp_v1 and the
  # backtest scores opposition at league average, so an xG team model is *unmeasurable* here and
  # enabling it would be acting on faith rather than evidence (DP-12).
  expected_goals:
    enabled: true
    team_strength_from_xg: false

  # E10's discrimination candidates (DL-47). Every flag here is off and stays off in the shipped
  # configuration: these are genuine new model behaviours, not delivery bugs, so DP-08 applies in
  # full — flagged, graded by the backtest against the flag being off, and promoted only once the
  # E8 §5 bar is met, which includes six live shadow gameweeks that cannot exist before the season
  # does. Turning one on here is what starts that story's shadow clock.
  #
  # minutes_v2 (E10-S1) adds three adjustments to M1: a rotation prior on fixture density, an
  # injury-return ramp, and a live availability haircut that hits starting harder than appearing.
  # The tunables are in the pydantic defaults and are not repeated here — listing them twice is how
  # they drift.
  # adaptive_shrinkage (E10-S2) makes M3-M7's prior weight a function of how much evidence a player
  # has, so a nailed starter is pulled toward his position prior less hard than a newcomer. Off, and
  # off with a stronger reason than DP-08 alone: DL-49 ran the Q-14 sweep and found the trade turns
  # at a strength of 0.4 without clearing the bar — the precision gain there is inside the noise and
  # the calibration slope degrades by construction. The flag exists so the finding is re-checkable,
  # not because it is waiting for a promotion.
  # duty_term (E10-S3) makes penalty duty an explicit additive term at the horizon scorer, reading
  # the committed reference table in `duty.yaml`. Off, and off with the same shape of reason S2
  # carries: DL-50 measured it and it does not clear the bar. The term restores only the share of a
  # taker's penalty return that shrinkage removed, which is why it is largest for a newly appointed
  # taker and near-inert for a well-observed one — and the head of the ranking is made of
  # well-observed players. **Confirm the 2026/27 entries in `duty.yaml` against the opening
  # gameweeks before ever turning this on**; they are FPL's own pre-season field, which is stale for
  # promoted clubs and new signings by construction.
  # gkp_v2 (E10-S4) estimates a goalkeeper's saves from the pressure M2 expects in his fixture
  # rather than from a fixture-blind shrunk per-90 — the position's clean sheet and concession
  # points already come from M2, and saves were the one part that did not. Off, and off with the
  # same shape of reason S2 and S3 carry: DL-51 measured both halves of Q-15's falsifier and
  # neither cleared the stated bar. Note what the model reads for *pressure*: nothing in silver
  # counts shots, so expected goals conceded stands in for them, and that substitution is an
  # argument rather than a detail — read DL-51 before turning this on.
  discrimination:
    minutes_v2: false
    adaptive_shrinkage: false
    duty_term: false
    gkp_v2: false

  # Which model the app reads (E9-S1, DL-46). xp_v1 — the component chain the walk-forward backtest
  # actually grades — is the default publish target, because D-25's defect was that the shipped
  # model was not the graded one. That is a delivery bug, which DP-08 names as its own exception,
  # not a new model needing a shadow window; there is no flag here gating it behind a promotion.
  #
  # xp_v0 remains as the cold-start fallback and nothing else. It fires only when the current season
  # has fewer completed gameweeks than the figure below, and when it fires it is named in the model
  # card and in the stage metrics — never silently (DP-15).
  #
  # The DL-21 guardrail is unchanged by any of this: no -8 hit, chip or wildcard on xp_v1 alone
  # until top-20 precision beats B0.
  published:
    default_since: 2026-08-17
    cold_start_minimum_gameweeks: 4

optimiser:
  bench_weight: 0.15
  captain_multiplier: 2
  solve_time_limit_seconds: 60
  solver: CBC
  enforce_start_probability_floor: true
  # Overrides from the E0-S8 review gate go in config/local.yaml, never by editing the output.
  locked_player_ids: []
  banned_player_ids: []
  excluded_team_ids: []
