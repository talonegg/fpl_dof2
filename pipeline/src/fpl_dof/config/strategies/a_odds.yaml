# See c3.yaml for what this file is.
id: a_odds
label: A + odds
description: Model A with the bookmaker-odds team layer where every fixture of a club's gameweek is priced; no advice without odds.
role: challenger
published: true # live since R1.2.2 (MOD-05)
aliases: [A_odds]
forecaster:
  type: recipe
  model: a_odds_team_layer # shadow/a_odds.py; A's tunables in forecast.a, the odds layer's in forecast.a_odds
  config: {}
  training_window: all_seasons # prior seasons from the archive plus the current, as its frozen original (DL-89)
policy:
  captain_rule: price_position
  plan: false # one gameweek, as A
requires: [player_gameweek, fixture, team_match_expectation] # no odds at all: no advice (DL-87)
