# See c3.yaml for what this file is.
id: c1
label: Challenger (C1)
description: Boosted xG and minutes model; captain by price and position. Pre-registered against C3 on all-player xP MAE, with no look before GW10.
role: challenger
published: true
aliases: [C1, challenger] # the frozen harness's key and the web's old id
forecaster:
  type: recipe
  model: c1_gbm_xg_minutes # shadow/c1.py; hyperparameters and seed in forecast.c1
  config: {}
  training_window: all_seasons # prior seasons from the archive plus the current, as its frozen original (DL-89)
policy:
  captain_rule: price_position
  # C1 forecasts the next gameweek only (a one-gameweek horizon), so a plan of its own would be
  # that one gameweek and zeros beyond it.
  plan: false
requires: [player_gameweek, fixture] # no cold-start fallback: with no played history, no advice
