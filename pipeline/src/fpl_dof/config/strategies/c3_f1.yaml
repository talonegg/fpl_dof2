# Experiment F1 (MOD-09, experiments/f1_card_rates.yaml), shipped into c3 by DL-90. Until the CI
# backtest has written F1's record to `ledger`, this entry is the control: the champion as it was
# before the fix, without yellow_cards in the rolling statistics. Retired once the record exists.
id: c3_f1
label: C3 before card rates (F1 control)
description: The champion without each player's own card rate, as before DL-90; graded against c3.
role: experiment
published: false
forecaster:
  type: recipe
  model: xp_v1
  config:
    features:
      rolling_statistics: [goals_scored, assists, clean_sheets, saves, bonus, bps,
        defensive_contribution, expected_goals, expected_assists, total_points]
  training_window: current_season
policy:
  captain_rule: price_position
  plan: true
requires: [fixture]
