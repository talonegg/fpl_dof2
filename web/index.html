    <!-- Two theme colours, so the browser chrome follows the palette rather than fighting it. The
         values match `--bg` and its dark counterpart in `src/tokens.css`; they are duplicated here
         because a `<meta>` tag cannot read a custom property, and that duplication is checked by
         `verify/browser-check.mjs` rather than left to be noticed. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1720" />
